<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form validation practice</title>
  </head>
  <body>
    <form novalidate>
      <header>
        <h1 class="form__title">Account Details</h1>
      </header>
      <div>
        <label for="email" required>Email</label>
        <input type="email" id="email" name="email" />
        <div class="error" aria-live="polite"">
          <p>Error present.....ddsfadfdsd fasddfsa dffsddssf</p>
        </div>
      </div>
      <div>
        <label for="country">Country</label>
        <select name="country" id="country" required>
          <option value="">Select a country</option>
          <option value="BG">Bulgaria</option>
          <option value="BE">Belgium</option>
          <option value="FR">France</option>
        </select>
      </div>
      <div>
        <label for="postcode">Postal Code</label>
        <input type="tel" id="postcode" name="postcode" required/>
      </div>
      <div>
        <label for="passw">Password</label>
        <input type="password" id="passw" name="passw" required minlength="12"/>
      </div>
      <div>
        <label for="passw-confirm">Confirm Password</label>
        <input type="password" id="passw-confirm" name="passw-confirm" required minlength="12"/>
      </div>
      <div>
        <button type="submit">Create Account</button>
      </div>
    </form>
  </body>
</html>
